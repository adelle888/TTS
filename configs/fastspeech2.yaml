model_name: fastspeech2
dataset: LJSpeech
preprocess:
  dataset: LJSpeech
  path:
    corpus_path: /data/huawei/liufei/TTS/FastSpeech2/raw_data/LJSpeech-1.1
    lexicon_path: lexicon/librispeech-lexicon.txt
    raw_path: /data/huawei/liufei/TTS/FastSpeech2/raw_data/LJSpeech/LJSpeech
    preprocessed_path: /data/huawei/liufei/TTS/FastSpeech2/preprocessed_data/LJSpeech
  preprocessing:
    val_size: 512
    text:
      text_cleaners:
      - english_cleaners
      language: en
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: phoneme_level
      normalization: true
    energy:
      feature: phoneme_level
      normalization: true
model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size:
    - 9
    - 1
    encoder_dropout: 0.2
    decoder_dropout: 0.2
  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5
  variance_embedding:
    pitch_quantization: linear
    energy_quantization: linear
    n_bins: 256
  multi_speaker: false
  max_seq_len: 1000
  vocoder:
    model: HiFi-GAN
    speaker: LJSpeech
  vocab_size: 361
train:
  path:
    ckpt_path: ./output/ckpt/LJSpeech
    log_path: ./output/log/LJSpeech
    result_path: ./output/result/LJSpeech
  optimizer:
    batch_size: 16
    betas:
    - 0.9
    - 0.98
    eps: 1.0e-09
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps:
    - 300000
    - 400000
    - 500000
    anneal_rate: 0.3
  step:
    total_step: 900000
    log_step: 100
    synth_step: 1000
    val_step: 1000
    save_step: 100000
